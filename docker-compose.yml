version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: resumeiq_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=resumeiq

  server:
    build: ./server
    container_name: resumeiq_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/resumeiq
      - JWT_SECRET=supersecret_resumeiq_jwt_key_2026_production_grade
      - CLIENT_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: resumeiq_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
